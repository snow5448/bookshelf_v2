<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本棚アプリ</title>
</head>
<body>
    <h1>本棚</h1>
    <form method="post">
        <input type="text" name="title" placeholder="タイトル">
        <input type="number" name="start" placeholder="何巻から">
        <input type="number" name="end" placeholder="何巻まで">
        <button>登録</button>
    </form>
    <ul>
        {% for row in rows %}
            <li>{{ row[1] }}</li>
        {% endfor %}
    </ul>
</body>
</html>
